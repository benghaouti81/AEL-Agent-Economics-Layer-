name: AEL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --strict)
        run: npm run lint

      - name: Run Vitest unit & engine tests
        run: npm test

      - name: Build frontend distribution
        run: npm run build

  verify-dod:
    name: verify-dod
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check live evaluation credential availability (never simulate)
        run: |
          echo "Live evaluation: SKIPPED / NOT RUN (CI standard workflow does not configure live provider API credentials; mock simulation is permanently removed)."
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### AEL Live Evaluation Status"
              echo "- **Live Performance Benchmark**: **SKIPPED / NOT RUN** (no live provider credentials in standard CI; run \`.github/workflows/live-eval.yml\` with \`GEMINI_API_KEY\` for live benchmark evidence)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run V8 coverage report for engines gate (e)
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=json-summary

      - name: Run verify-dod checks
        run: npm run verify:dod
