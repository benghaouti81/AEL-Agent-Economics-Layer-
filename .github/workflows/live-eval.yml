name: AEL Live Evaluation (Gemini)

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Gemini model ID (default: gemini-2.5-flash-lite for 15 RPM free tier)'
        required: false
        default: 'gemini-2.5-flash-lite'
        type: string
      limit_per_category:
        description: 'Max tasks per category (default: 5 for free tier; 0 runs full 200-task held_out suite on paid keys)'
        required: false
        default: '5'
        type: string
      max_cost_usd:
        description: 'Spending guard cap in USD (default: 1.0)'
        required: false
        default: '1.0'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  live-eval:
    name: Live Gemini Evaluation (Budget Held-Out + Tool-DC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVAL_MODEL: ${{ inputs.model || 'gemini-2.5-flash-lite' }}
      EVAL_LIMIT: ${{ inputs.limit_per_category || '5' }}
      EVAL_MAX_COST_USD: ${{ inputs.max_cost_usd || '1.0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Mask and validate GEMINI_API_KEY secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is missing."
            exit 1
          fi
          echo "::add-mask::$GEMINI_API_KEY"

      - name: Spending guard preflight (abort if projected cost > cap)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AEL_LIVE_EVAL: '1'
        run: |
          echo "Live eval configuration: model=${EVAL_MODEL}, limit_per_category=${EVAL_LIMIT}, max_cost_usd=${EVAL_MAX_COST_USD}"
          npx tsx bin/ael.ts eval --suite all --split held_out --live --model "$EVAL_MODEL" --limit "$EVAL_LIMIT" --max-cost-usd "$EVAL_MAX_COST_USD" --preflight-only

      - name: Run Thinking Budget suite live (held_out)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AEL_LIVE_EVAL: '1'
        run: npx tsx bin/ael.ts eval --suite budget --split held_out --live --model "$EVAL_MODEL" --limit "$EVAL_LIMIT" --max-cost-usd "$EVAL_MAX_COST_USD" --db /tmp/live_eval.db

      - name: Run Tool-DC suite live
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AEL_LIVE_EVAL: '1'
        run: npx tsx bin/ael.ts eval --suite tool --live --model "$EVAL_MODEL" --limit "$EVAL_LIMIT" --max-cost-usd "$EVAL_MAX_COST_USD" --db /tmp/live_eval.db

      - name: Verify live result files, model, sample_size, and provider_source
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          node -e "
            const fs = require('fs');
            for (const f of ['evals/results/${RUN_DATE}_live_budget_held_out.json', 'evals/results/${RUN_DATE}_live_tool_selection.json']) {
              if (!fs.existsSync(f)) throw new Error('Missing live result file: ' + f);
              const data = JSON.parse(fs.readFileSync(f, 'utf8'));
              if (data.provider_source !== 'gemini') {
                throw new Error(f + ' has provider_source=' + data.provider_source + ' (expected gemini)');
              }
              if (!data.model || !data.sample_size) {
                throw new Error(f + ' must explicitly record model and sample_size');
              }
              console.log('Verified', f, 'provider_source=' + data.provider_source, 'model=' + data.model, 'sample_size=' + JSON.stringify(data.sample_size), 'status=' + data.acceptance_status);
            }
          "

      - name: Commit live evaluation results
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/results/${RUN_DATE}_live_*.json
          if git diff --cached --quiet; then
            echo "No changes to live evaluation result files."
            exit 0
          fi
          git commit -m "eval(live): record Gemini live evaluation results (${RUN_DATE}, ${EVAL_MODEL}, limit=${EVAL_LIMIT})"
          if git symbolic-ref -q HEAD >/dev/null; then
            git push
          else
            echo "Running on detached tag ref; skipping branch push."
          fi
